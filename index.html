<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Professores</title>
<style>
.assignment-box,#assignments,form > h2:nth-of-type(2){display:none!important}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f8;
      color: #17202a;
    }

    header {
      background: #155a76;
      color: #ffffff;
      padding: 22px;
    }

    .header-content {
      width: min(1380px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .header-text {
      min-width: 0;
    }

    header h1 {
      margin: 0;
      font-size: 1.7rem;
    }

    header p {
      margin: 6px 0 0;
    }

    .site-logo {
      width: clamp(115px, 13vw, 180px);
      height: auto;
      flex: 0 0 auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18));
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    main {
      display: grid;
      gap: 18px;
    }

    .teacher-sidebar {
      background: #ffffff;
      border: 1px solid #d8dee7;
      border-radius: 8px;
      padding: 14px;
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 24px);
      overflow: auto;
    }

    .teacher-sidebar h2 {
      margin-bottom: 6px;
    }

    .teacher-sidebar p {
      margin: 0 0 12px;
      color: #687180;
      font-size: 0.92rem;
    }

    .teacher-list {
      display: grid;
      gap: 6px;
    }

    .teacher-name {
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid #d8dee7;
      background: #f7fafc;
      color: #17202a;
      border-radius: 6px;
      text-align: left;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }

    .teacher-name.saved {
      border-color: #1d8c5a;
      background: #e5f6ee;
      color: #12613d;
    }

    section {
      background: #ffffff;
      border: 1px solid #d8dee7;
      border-radius: 8px;
      padding: 18px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.25rem;
      color: #155a76;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 42px;
      font: inherit;
      border-radius: 6px;
    }

    input,
    select {
      border: 1px solid #b9c3cf;
      background: #ffffff;
      padding: 9px 10px;
      color: #17202a;
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(29, 111, 143, 0.2);
      border-color: #1d6f8f;
    }

    button {
      border: 1px solid #155a76;
      background: #155a76;
      color: #ffffff;
      padding: 0 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #ffffff;
      color: #155a76;
    }

    button.danger {
      border-color: #b33a2c;
      background: #ffffff;
      color: #b33a2c;
    }

    .assignment-box {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      padding: 14px;
      background: #f7fafc;
      border: 1px solid #d8dee7;
      border-radius: 8px;
    }

    .assignment-box button {
      min-width: 120px;
    }

    .assignment-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .assignment-item,
    .record {
      border: 1px solid #d8dee7;
      border-radius: 8px;
      padding: 12px;
      background: #ffffff;
    }

    .assignment-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .assignment-item button,
    .record button {
      width: auto;
      min-height: 34px;
    }

    .form-actions,
    .toolbar,
    .record-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .toolbar {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .toolbar input {
      flex: 1 1 260px;
    }

    .toolbar button,
    .form-actions button {
      width: auto;
    }

    .record {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }

    .record h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .record p {
      margin: 0;
      color: #4c5967;
    }

    .empty {
      color: #687180;
      padding: 14px 0;
    }

    .hidden {
      display: none !important;
    }

    .admin-status {
      margin-top: 10px;
      color: #4c5967;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .header-content {
        align-items: flex-start;
      }

      .site-logo {
        width: 104px;
      }

      .page {
        grid-template-columns: 1fr;
      }

      .teacher-sidebar {
        position: static;
        max-height: 360px;
      }

      .grid,
      .assignment-box {
        grid-template-columns: 1fr;
      }

      .toolbar button,
      .form-actions button,
      .assignment-box button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-text">
        <h1>Cadastro de Professores</h1>
        <p></p>
      </div>
      <img class="site-logo" src="assets/lf-sistemas-logo.png" alt="LF Sistemas">
    </div>
  </header>

  <div class="page">
    <aside class="teacher-sidebar">
      <h2>Professores</h2>
      <p>Os nomes ficam verdes depois que o cadastro é salvo.</p>
      <div class="teacher-list" id="teacherList"></div>
    </aside>

  <main>
    <section>
      <h2>Dados pessoais</h2>
      <form id="teacherForm">
        <input type="hidden" id="recordId" name="recordId">

        <div class="grid">
          <div>
            <label for="name">Nome completo</label>
            <input id="name" name="name" required>
          </div>
          <div>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required>
          </div>
          <div>
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" required>
          </div>
          <div>
            <label for="rg">RG</label>
            <input id="rg" name="rg" required>
          </div>
          <div>
            <label for="issuingAgency">Órgão emissor</label>
            <input id="issuingAgency" name="issuingAgency" required>
          </div>
          <div>
            <label for="birthDate">Data de nascimento</label>
            <input id="birthDate" name="birthDate" type="date" required>
          </div>
          <div class="full">
            <label for="address">Endereço</label>
            <input id="address" name="address" required>
          </div>
          <div>
            <label for="addressNumber">Número</label>
            <input id="addressNumber" name="addressNumber" required>
          </div>
          <div>
            <label for="neighborhood">Bairro</label>
            <input id="neighborhood" name="neighborhood" required>
          </div>
          <div>
            <label for="city">Município</label>
            <input id="city" name="city" required>
          </div>
          <div>
            <label for="contact">Contato</label>
            <input id="contact" name="contact" required>
          </div>
        </div>

          <div><label for="PROFISSIONAL_CO_UF_RES">Estado</label><input id="PROFISSIONAL_CO_UF_RES" name="PROFISSIONAL_CO_UF_RES"></div>
          <div><label for="PROFISSIONAL_CEP_RES">CEP</label><input id="PROFISSIONAL_CEP_RES" name="PROFISSIONAL_CEP_RES"></div>
          <div><label for="PROFISSIONAL_LOCALIZACAO_GEOGRAFICA">Localização Geográfica</label><input id="PROFISSIONAL_LOCALIZACAO_GEOGRAFICA" name="PROFISSIONAL_LOCALIZACAO_GEOGRAFICA"></div>
          <div><label for="PROFISSIONAL_LOCALIZACAO_DIFERENCIADA">Localização Diferenciada</label><input id="PROFISSIONAL_LOCALIZACAO_DIFERENCIADA" name="PROFISSIONAL_LOCALIZACAO_DIFERENCIADA"></div>
          <div><label for="PROFISSIONAL_SEXO">Sexo</label><select id="PROFISSIONAL_SEXO" name="PROFISSIONAL_SEXO"><option value="">Selecione</option><option>Feminino</option><option>Masculino</option><option>Não informado</option></select></div>
          <div><label for="PROFISSIONAL_GENERO">Gênero</label><input id="PROFISSIONAL_GENERO" name="PROFISSIONAL_GENERO"></div>
          <div><label for="PROFISSIONAL_RACA_COR">Raça/Cor</label><select id="PROFISSIONAL_RACA_COR" name="PROFISSIONAL_RACA_COR"><option value="">Selecione</option><option>Branca</option><option>Preta</option><option>Parda</option><option>Amarela</option><option>Indígena</option><option>Não declarada</option></select></div>
          <div><label for="PROFISSIONAL_QUILOMBOLA">Autodeclaração quilombola</label><select id="PROFISSIONAL_QUILOMBOLA" name="PROFISSIONAL_QUILOMBOLA"><option value="">Selecione</option><option>Sim</option><option>Não</option></select></div>
          <div><label for="PROFISSIONAL_NACIONALIDADE">Nacionalidade</label><input id="PROFISSIONAL_NACIONALIDADE" name="PROFISSIONAL_NACIONALIDADE"></div>
          <div><label for="PROFISSIONAL_PAIS_NASCIMENTO">País de nascimento</label><input id="PROFISSIONAL_PAIS_NASCIMENTO" name="PROFISSIONAL_PAIS_NASCIMENTO"></div>
          <div><label for="PROFISSIONAL_ESTADO_NASCIMENTO">Estado de nascimento</label><input id="PROFISSIONAL_ESTADO_NASCIMENTO" name="PROFISSIONAL_ESTADO_NASCIMENTO"></div>
          <div><label for="PROFISSIONAL_MUNICIPIO_NASCIMENTO">Município de nascimento</label><input id="PROFISSIONAL_MUNICIPIO_NASCIMENTO" name="PROFISSIONAL_MUNICIPIO_NASCIMENTO"></div>
          <div><label for="PROFISSIONAL_DEFICIENCIA">Deficiência, TEA ou altas habilidades</label><select id="PROFISSIONAL_DEFICIENCIA" name="PROFISSIONAL_DEFICIENCIA"><option value="">Selecione</option><option>Não</option><option>Sim</option></select></div>
          <div><label for="CO_NIVEL_ESCOLARIDADE">Maior escolaridade concluída</label><input id="CO_NIVEL_ESCOLARIDADE" name="CO_NIVEL_ESCOLARIDADE"></div>
          <div><label for="CO_TIPO_FORMACAO_ACADEMICA">Tipo de formação superior</label><input id="CO_TIPO_FORMACAO_ACADEMICA" name="CO_TIPO_FORMACAO_ACADEMICA"></div>
          <div><label for="CO_AREA_DO_CONHECIMENTO_FORMACAO_ACADEMICA">Área do curso</label><input id="CO_AREA_DO_CONHECIMENTO_FORMACAO_ACADEMICA" name="CO_AREA_DO_CONHECIMENTO_FORMACAO_ACADEMICA"></div>
          <div><label for="CO_CURSO_FORMACAO_ACADEMICA">Curso</label><input id="CO_CURSO_FORMACAO_ACADEMICA" name="CO_CURSO_FORMACAO_ACADEMICA"></div>
          <div><label for="NO_INSTITUICAO_ENSINO_FORMACAO_ACADEMICA">Instituição de ensino</label><input id="NO_INSTITUICAO_ENSINO_FORMACAO_ACADEMICA" name="NO_INSTITUICAO_ENSINO_FORMACAO_ACADEMICA"></div>
          <div><label for="NATUREZA_INSTITUICAO_FORMACAO_ACADEMICA">Tipo da instituição</label><input id="NATUREZA_INSTITUICAO_FORMACAO_ACADEMICA" name="NATUREZA_INSTITUICAO_FORMACAO_ACADEMICA"></div>

          <div><label for="CO_ENTIDADE_VINCULO">Código INEP da instituição</label><input id="CO_ENTIDADE_VINCULO" name="CO_ENTIDADE_VINCULO"></div>
          <div><label for="CO_PROFISSIONAL_PERFIL_VINCULO">Perfil</label><input id="CO_PROFISSIONAL_PERFIL_VINCULO" name="CO_PROFISSIONAL_PERFIL_VINCULO"></div>

          <div><label for="SITUACAO_VINCULO_PROFISSIONAL_REDE">Situação do vínculo</label><input id="SITUACAO_VINCULO_PROFISSIONAL_REDE" name="SITUACAO_VINCULO_PROFISSIONAL_REDE"></div>
          <div><label for="DATA_INICIO_VINCULO_PROFISSIONAL_REDE">Data de início do vínculo</label><input id="DATA_INICIO_VINCULO_PROFISSIONAL_REDE" name="DATA_INICIO_VINCULO_PROFISSIONAL_REDE" type="date"></div>

          <div><label for="DATA_FIM">Data do fim da função</label><input id="DATA_FIM" name="DATA_FIM" type="date"></div>
          <div><label for="CARGA_HORARIA_SEMANAL">Carga horária semanal</label><input id="CARGA_HORARIA_SEMANAL" name="CARGA_HORARIA_SEMANAL" type="number"></div>
          <div><label for="PROFISSIONAL_IDENTIFICACAO_INSTITUICAO">ID da matrícula</label><input id="PROFISSIONAL_IDENTIFICACAO_INSTITUICAO" name="PROFISSIONAL_IDENTIFICACAO_INSTITUICAO"></div>
          <div class="full"><label for="AREA_CONHECIMENTO_VINCULO_PROFISSIONAL">Área do conhecimento</label><input id="AREA_CONHECIMENTO_VINCULO_PROFISSIONAL" name="AREA_CONHECIMENTO_VINCULO_PROFISSIONAL"></div>
        </div>

        <h2 class="assignments-heading" style="margin-top: 24px;">Turmas e disciplinas</h2>
        <div class="assignment-box">
          <div>
            <label for="gradeSelect">Turma</label>
            <select id="gradeSelect">
              <option value="">Selecione a turma</option>
            </select>
          </div>
          <div>
            <label for="subjectSelect">Disciplina</label>
            <select id="subjectSelect">
              <option value="">Selecione a disciplina</option>
            </select>
          </div>
          <button type="button" id="addAssignmentButton">Adicionar</button>
        </div>

        <div class="assignment-list" id="assignments"></div>

        <div class="form-actions">
          <button type="submit" id="saveButton">Salvar dados</button>
          <button class="secondary" type="button" id="clearTextButton">Limpar campos de texto</button>
          <button class="secondary" type="button" id="cancelEditButton">Cancelar edição</button>
        </div>
      </form>
    </section>

    <section>
      <h2>Área do administrador</h2>
      <div id="loginBox">
        <div class="grid">
          <div>
            <label for="adminPassword">Senha do admin</label>
            <input id="adminPassword" type="password" autocomplete="current-password">
          </div>
          <div style="align-self: end;">
            <button type="button" id="adminLoginButton">Entrar como admin</button>
          </div>
        </div>
      </div>
      <div id="adminBox" class="hidden">
        <p class="admin-status">Admin logado. Os registros completos estão visíveis abaixo.</p>
        <button class="secondary" type="button" id="adminLogoutButton">Sair do admin</button>
      </div>
    </section>

    <section id="adminPanel" class="hidden">
      <h2>Registros salvos</h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Buscar por nome, turma ou disciplina">
        <button class="secondary" type="button" id="exportButton">Exportar CSV</button>
        <button class="secondary" type="button" id="exportExcelButton">Exportar Excel</button>
        <button class="secondary" type="button" id="exportPdfButton">Exportar PDF</button>
        <button class="danger" type="button" id="clearAllButton">Apagar todos</button>
      </div>
      <div id="records"></div>
    </section>
  </main>
  </div>

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function fillSelect(select, options, placeholder) {
      select.innerHTML = `<option value="">${placeholder}</option>` + options
        .map((option) => `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`)
        .join("");
    }

    function normalizeName(name) {
      return String(name || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    async function loadRecords() {
      if (!adminToken) {
        records = [];
        return;
      }

      try {
        const response = await fetch("/api/records", {
          headers: { Authorization: `Bearer ${adminToken}` }
        });
        if (!response.ok) throw new Error("Falha ao carregar dados");
        records = (await response.json()).map((record) => ({
          ...record,
          id: record.id || createId()
        }));
      } catch (error) {
        adminToken = "";
        localStorage.removeItem(adminTokenKey);
        records = [];
        alert("Login do admin expirou ou falhou. Entre novamente.");
      }
    }

    async function loadSavedTeacherNames() {
      try {
        const response = await fetch("/api/records?summary=names");
        if (!response.ok) throw new Error("Falha ao carregar nomes");
        const data = await response.json();
        savedTeacherNames = Array.isArray(data.names) ? data.names : [];
      } catch (error) {
        savedTeacherNames = [];
      }
    }

    async function saveRecords() {
      const response = await fetch("/api/records", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${adminToken}`
        },
        body: JSON.stringify(records)
      });

      if (!response.ok) {
        throw new Error("Falha ao salvar os dados no servidor");
      }
    }

    async function submitPublicRecord(record) {
      const response = await fetch("/api/records", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record)
      });

      if (!response.ok) {
        throw new Error("Falha ao enviar cadastro");
      }
    }

    async function deleteRecordOnline(id) {
      const response = await fetch(`/api/records?id=${encodeURIComponent(id)}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${adminToken}` }
      });

      if (!response.ok) {
        throw new Error("Falha ao excluir o registro no servidor");
      }

      const result = await response.json();
      records = Array.isArray(result.records) ? result.records : records.filter((item) => item.id !== id);
      localStorage.setItem(storageKey, JSON.stringify(records));
    }

    function createId() {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
      return `prof-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function formatAssignments(list) {
      return (list || []).map((item) => `${item.grade} - ${item.subject}`).join("; ");
    }

    function normalizeAssignments(record) {
      if (Array.isArray(record.assignments)) {
        return record.assignments.filter((item) => item.grade && item.subject);
      }

      const grades = String(record.grade || "").split(",").map((item) => item.trim()).filter(Boolean);
      const subjects = String(record.subject || "").split(",").map((item) => item.trim()).filter(Boolean);
      const total = Math.max(grades.length, subjects.length);

      return Array.from({ length: total }, (_, index) => ({
        grade: grades[index] || grades[0] || "",
        subject: subjects[index] || subjects[0] || ""
      })).filter((item) => item.grade && item.subject);
    }

    function renderAssignments() {
      if (assignments.length === 0) {
        assignmentsEl.innerHTML = `<div class="empty">Nenhuma turma e disciplina adicionada.</div>`;
        return;
      }

      assignmentsEl.innerHTML = assignments.map((item, index) => `
        <div class="assignment-item">
          <span><strong>${escapeHtml(item.grade)}</strong> - ${escapeHtml(item.subject)}</span>
          <button class="danger" type="button" data-remove-assignment="${index}">Remover</button>
        </div>
      `).join("");
    }

    function getFormData() {
      const data = Object.fromEntries(new FormData(form).entries());
      return Object.fromEntries(Object.entries(data).map(([key, value]) => [key, String(value).trim()]));
    }

    function resetForm() {
      form.reset();
      document.querySelector("#recordId").value = "";
      gradeSelectEl.value = "";
      subjectSelectEl.value = "";
      assignments = [];
      renderAssignments();
      document.getElementById("saveButton").textContent = "Salvar dados";
    }

    function clearTextFields() {
      ["name", "email", "cpf", "rg", "issuingAgency", "birthDate", "address", "addressNumber", "neighborhood", "city", "contact"].forEach((id) => {
        const field = document.getElementById(id);
        if (field) field.value = "";
      });
    }

    function cancelEdit() {
      resetForm();
    }

    function renderTeacherList() {
      const sourceNames = adminToken ? records.map((record) => record.name) : savedTeacherNames;
      const savedNames = new Set(sourceNames.map((name) => normalizeName(name)));
      teacherListEl.innerHTML = teacherNames.map((name) => {
        const saved = savedNames.has(normalizeName(name)) ? " saved" : "";
        return `<button class="teacher-name${saved}" type="button" data-teacher-name="${escapeHtml(name)}">${escapeHtml(name)}</button>`;
      }).join("");
    }

    function setAdminMode(enabled) {
      loginBoxEl.classList.toggle("hidden", enabled);
      adminBoxEl.classList.toggle("hidden", !enabled);
      adminPanelEl.classList.toggle("hidden", !enabled);
    }

    async function adminLogin() {
      const password = adminPasswordEl.value;
      if (!password) {
        alert("Digite a senha do admin.");
        return;
      }

      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });

      if (!response.ok) {
        alert("Senha de admin inválida ou não configurada.");
        return;
      }

      const result = await response.json();
      adminToken = result.token;
      localStorage.setItem(adminTokenKey, adminToken);
      adminPasswordEl.value = "";
      setAdminMode(true);
      await loadRecords();
      savedTeacherNames = records.map((record) => record.name);
      renderTeacherList();
      renderRecords();
    }

    function adminLogout() {
      adminToken = "";
      localStorage.removeItem(adminTokenKey);
      records = [];
      setAdminMode(false);
      loadSavedTeacherNames().then(renderTeacherList);
      renderTeacherList();
      renderRecords();
    }

    function renderRecords() {
      const query = searchEl.value.trim().toLowerCase();
      const visibleRecords = records
        .map((record, index) => ({ record, index }))
        .filter(({ record }) => {
        const text = [record.name, record.email, formatAssignments(normalizeAssignments(record))].join(" ").toLowerCase();
        return text.includes(query);
      });

      if (visibleRecords.length === 0) {
        recordsEl.innerHTML = `<div class="empty">${records.length ? "Nenhum registro encontrado." : "Nenhum professor cadastrado ainda."}</div>`;
        return;
      }

      recordsEl.innerHTML = visibleRecords.map(({ record, index }) => `
        <article class="record">
          <h3>${escapeHtml(record.name)}</h3>
          <p>${escapeHtml(record.email)}</p>
          <p><strong>Contato:</strong> ${escapeHtml(record.contact)}</p>
          <p><strong>Turmas e disciplinas:</strong> ${escapeHtml(formatAssignments(normalizeAssignments(record)))}</p>
          <div class="record-actions">
            <button class="secondary" type="button" data-edit-index="${index}">Editar</button>
            <button class="danger" type="button" data-delete="${record.id}">Excluir</button>
          </div>
        </article>

    function setFieldValue(id, value) {
      const field = document.getElementById(id);
      if (!field) return;
      field.disabled = false;
      field.readOnly = false;
      field.removeAttribute("disabled");
      field.removeAttribute("readonly");
      field.value = value || "";
      field.defaultValue = value || "";

    function editRecord(index) {
      const record = records[index];
      if (!record) {
        alert("Não foi possível encontrar este registro para editar.");
        return;
      }

      setFieldValue("recordId", record.id);
      setFieldValue("name", record.name);
      setFieldValue("email", record.email);
      setFieldValue("cpf", record.cpf);
      setFieldValue("rg", record.rg);
      setFieldValue("issuingAgency", record.issuingAgency);
      setFieldValue("birthDate", record.birthDate);
      setFieldValue("address", record.address);
      setFieldValue("addressNumber", record.addressNumber);
      setFieldValue("neighborhood", record.neighborhood);
      setFieldValue("city", record.city);
      setFieldValue("contact", record.contact || record.phone);

    function exportCsv() {
      if (records.length === 0) {
        alert("Não há registros para exportar.");
        return;
      }

      const headers = ["Nome completo", "E-mail", "CPF", "RG", "Órgão emissor", "Data de nascimento", "Endereço", "Número", "Bairro", "Município", "Contato", "Turmas e disciplinas"];
      const rows = records.map((record) => [
        record.name,
        record.email,
        record.cpf,
        record.rg,
        record.issuingAgency,
        record.birthDate,
        record.address,
        record.addressNumber,
        record.neighborhood,
        record.city,
        record.contact,
        formatAssignments(normalizeAssignments(record))
      ]);

      const csv = [headers, ...rows]
        .map((row) => row.map((cell) => `"${String(cell || "").replaceAll('"', '""')}"`).join(";"))
        .join("\n");

      const blob = new Blob([`\ufeff${csv}`], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "dados-professores.csv";
      link.click();
      URL.revokeObjectURL(url);
    }

    document.querySelector("#addAssignmentButton").addEventListener("click", () => {
      const grade = gradeSelectEl.value;
      const subject = subjectSelectEl.value;

      if (!grade) {
        alert("Selecione a turma.");
        gradeSelectEl.focus();
        return;
      }

      if (!subject) {
        alert("Selecione a disciplina.");
        subjectSelectEl.focus();
        return;
      }

      const exists = assignments.some((item) => item.grade === grade && item.subject === subject);
      if (exists) {
        alert("Essa turma e disciplina já foram adicionadas.");
        return;
      }

      assignments.push({ grade, subject });
      subjectSelectEl.value = "";
      renderAssignments();
    });

    assignmentsEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove-assignment]");
      if (!button) return;
      assignments.splice(Number(button.dataset.removeAssignment), 1);
      renderAssignments();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = getFormData();

      // Turmas e disciplinas são opcionais no cadastro GpE.

      const recordId = data.recordId;
      const record = { ...data, assignments: [...assignments] };

      try {
        if (adminToken) {
          if (recordId) {
            records = records.map((item) => item.id === recordId ? { ...item, ...record } : item);
          } else {
            records.unshift({ ...record, id: createId() });
          }
          await saveRecords();
          savedTeacherNames = records.map((item) => item.name);
          renderTeacherList();
          renderRecords();
        } else {
          await submitPublicRecord(record);
          await loadSavedTeacherNames();
          renderTeacherList();
        }

        resetForm();
        alert("Dados salvos com sucesso.");
      } catch (error) {
        alert("Não foi possível salvar online. Tente novamente.");
      }
    });

      const fields = [...grid.children].filter((item) => item.querySelector("input, select"));
      const byId = new Map(fields.map((field) => [field.querySelector("input, select").id, field]));
      const exactOrder = ["cpf","rg","name","PROFISSIONAL_NOME_SOCIAL","birthDate","PROFISSIONAL_SEXO","PROFISSIONAL_GENERO","PROFISSIONAL_RACA_COR","PROFISSIONAL_QUILOMBOLA","PROFISSIONAL_NACIONALIDADE","PROFISSIONAL_PAIS_NASCIMENTO","PROFISSIONAL_ESTADO_NASCIMENTO","PROFISSIONAL_MUNICIPIO_NASCIMENTO","contact","email","CO_NIVEL_ESCOLARIDADE","CO_TIPO_ENSINO_MEDIO","NATUREZA_INSTITUICAO_MEDIO_PROFISSIONAL","PROFISSIONAL_CO_UF_RES","city","address","addressNumber","neighborhood","PROFISSIONAL_CEP_RES","PROFISSIONAL_LOCALIZACAO_GEOGRAFICA","PROFISSIONAL_LOCALIZACAO_DIFERENCIADA","PROFISSIONAL_DEFICIENCIA","CO_TIPO_FORMACAO_ACADEMICA","CO_AREA_DO_CONHECIMENTO_FORMACAO_ACADEMICA","CO_CURSO_FORMACAO_ACADEMICA","NO_INSTITUICAO_ENSINO_FORMACAO_ACADEMICA","NATUREZA_INSTITUICAO_FORMACAO_ACADEMICA","ANO_INICIO_FORMACAO_ACADEMICA","ANO_CONCLUSAO_FORMACAO_ACADEMICA","CO_ENTIDADE_VINCULO","CO_PROFISSIONAL_PERFIL_VINCULO","CO_TIPO_VINCULO","SITUACAO_VINCULO_PROFISSIONAL_REDE","DATA_INICIO_VINCULO_PROFISSIONAL_REDE","DATA_FIM_VINCULO_PROFISSIONAL_REDE","CO_FUNCAO","DATA_INGRESSO","DATA_FIM","CARGA_HORARIA_SEMANAL","PROFISSIONAL_IDENTIFICACAO_INSTITUICAO","AREA_CONHECIMENTO_VINCULO_PROFISSIONAL"];
      exactOrder.forEach((id) => { if (byId.has(id)) grid.appendChild(byId.get(id)); });
      byId.get("issuingAgency")?.remove();
      const labels = {cpf:"CPF*",rg:"RG",name:"Nome*",PROFISSIONAL_NOME_SOCIAL:"Nome Social",birthDate:"Data de Nascimento*",PROFISSIONAL_SEXO:"Sexo*",PROFISSIONAL_GENERO:"Gênero",PROFISSIONAL_RACA_COR:"Raça/Cor*",PROFISSIONAL_QUILOMBOLA:"Autodeclaração quilombola do Profissional da Educação*",PROFISSIONAL_NACIONALIDADE:"Nacionalidade*",PROFISSIONAL_PAIS_NASCIMENTO:"País de nascimento*",PROFISSIONAL_ESTADO_NASCIMENTO:"Estado de nascimento*",PROFISSIONAL_MUNICIPIO_NASCIMENTO:"Município de nascimento*",contact:"Telefone*",email:"E-mail*",CO_NIVEL_ESCOLARIDADE:"Maior nível de escolaridade concluído*",CO_TIPO_ENSINO_MEDIO:"Tipo de Ensino Médio",NATUREZA_INSTITUICAO_MEDIO_PROFISSIONAL:"Natureza da Instituição",PROFISSIONAL_CO_UF_RES:"Estado*",city:"Município*",address:"Logradouro de Residência",addressNumber:"Número de Endereço",neighborhood:"Bairro",PROFISSIONAL_CEP_RES:"CEP",PROFISSIONAL_LOCALIZACAO_GEOGRAFICA:"Localização Geográfica",PROFISSIONAL_LOCALIZACAO_DIFERENCIADA:"Localização Diferenciada",PROFISSIONAL_DEFICIENCIA:"Profissional com deficiência, transtorno do espectro autista ou altas habilidades/superdotação*",CO_TIPO_FORMACAO_ACADEMICA:"Tipo de Formação Superior*",CO_AREA_DO_CONHECIMENTO_FORMACAO_ACADEMICA:"Área do curso*",CO_CURSO_FORMACAO_ACADEMICA:"Curso",NO_INSTITUICAO_ENSINO_FORMACAO_ACADEMICA:"Nome da Instituição de Ensino",NATUREZA_INSTITUICAO_FORMACAO_ACADEMICA:"Tipo da Instituição de Ensino",ANO_INICIO_FORMACAO_ACADEMICA:"Ano de Início",ANO_CONCLUSAO_FORMACAO_ACADEMICA:"Ano de Conclusão",CO_ENTIDADE_VINCULO:"Código INEP da Instituição de Ensino*",CO_PROFISSIONAL_PERFIL_VINCULO:"Perfil",CO_TIPO_VINCULO:"Tipo de Vínculo*",SITUACAO_VINCULO_PROFISSIONAL_REDE:"Situação do Vínculo*",DATA_INICIO_VINCULO_PROFISSIONAL_REDE:"Data de Início do Vínculo*",DATA_FIM_VINCULO_PROFISSIONAL_REDE:"Data de Fim do Vínculo",CO_FUNCAO:"Código da função*",DATA_INGRESSO:"Data de Início da Função*",DATA_FIM:"Data do Fim da Função",CARGA_HORARIA_SEMANAL:"Carga Horária",PROFISSIONAL_IDENTIFICACAO_INSTITUICAO:"Número de Identificação (ID) da Matrícula do Profissional",AREA_CONHECIMENTO_VINCULO_PROFISSIONAL:"Área do conhecimento*",issuingAgency:"Órgão emissor"};
      Object.entries(labels).forEach(([id, text]) => { const field = byId.get(id); const label = field?.querySelector("label"); if (label) label.textContent = text; });
      document.querySelector(".assignments-heading")?.remove();
    }
    applyExactGpeOrderAndLabels();

    async function startApp() {
      fillSelect(gradeSelectEl, gradeOptions, "Selecione a turma");
      fillSelect(subjectSelectEl, subjectOptions, "Selecione a disciplina");
      setAdminMode(Boolean(adminToken));
      await loadSavedTeacherNames();
      await loadRecords();
      if (adminToken) savedTeacherNames = records.map((record) => record.name);
      renderTeacherList();
      renderAssignments();
      renderRecords();
    }

    startApp();
  </script>
</body>
